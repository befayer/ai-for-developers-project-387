name: OpenCode Weekly Audit

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC = 06:00 Moscow
  workflow_dispatch:

concurrency:
  group: opencode-weekly
  cancel-in-progress: false

jobs:
  audit:
    # Runs started by bots are skipped (course requirement for every agent workflow).
    # For schedule, github.actor is whoever last changed the cron: if a bot edits this
    # file, scheduled runs stop — update cron by hand.
    if: >-
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write permissions follow the course requirement for scheduled tasks:
    # the agent may file issues and open pull requests with fixes.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check APP_URL variable
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is not set (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Wake up the service
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Free Render instances sleep; give the service time to start before measuring.
          for i in $(seq 1 12); do
            curl -fsS -o /dev/null --max-time 20 "$APP_URL/api/v1/health" && exit 0
            sleep 10
          done
          echo "::error::$APP_URL did not answer /api/v1/health"
          exit 1

      - name: Run Lighthouse
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          mkdir -p lighthouse
          npx --yes lighthouse@12.8.2 "$APP_URL" \
            --output=json --output=html \
            --output-path=./lighthouse/report \
            --chrome-flags="--headless=new --no-sandbox" \
            --quiet

      - name: Save Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse/
          retention-days: 30

      - name: Run OpenCode audit
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Еженедельная проверка скорости и качества страницы. Пиши по-русски. Код не меняй.
            1. Прочитай ./lighthouse/report.report.json — отчёт Lighthouse по опубликованному приложению.
               Возьми оценки категорий (performance, accessibility, best-practices, seo) и проваленные аудиты
               с наибольшим влиянием. Числа бери только из отчёта.
            2. Создай issue командой
               gh issue create --repo ${{ github.repository }} --label kind:quality --title "Еженедельный отчёт Lighthouse: <дата>" --body-file <файл>
               В теле: таблица оценок, 3–5 главных находок (аудит, значение, почему это важно, где в src/ искать причину)
               и ссылка на прогон с артефактом отчёта: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            3. Если открытое issue «Еженедельный отчёт Lighthouse» уже есть, не создавай новое,
               а добавь в него комментарий с теми же разделами (gh issue comment).
            Если все четыре оценки не ниже 0.9 и проваленных аудитов с заметным влиянием нет,
            issue и комментарий не создавай — напиши итог в лог и закончи.
