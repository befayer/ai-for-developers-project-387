name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Review code written by people with write access; bot PRs and drafts are skipped.
    if: >-
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
      # write: review comments and reactions are posted with the runner token
      # (use_github_token); read-only failed with "Resource not accessible by integration".
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # required by use_github_token
        with:
          model: opencode/big-pickle
          use_github_token: true
          share: false
          prompt: |
            Сделай предварительное ревью этого pull request. Пиши по-русски.
            Сверяйся с AGENTS.md и CONTEXT.md.
            - Найди баги и рискованные изменения, особенно в правилах записи и доступности на сервере.
            - Проверь, что изменение контракта начинается с api/main.tsp и что новое правило покрыто тестом.
            - Отметь проблемы читаемости и сопровождения.
            Оставляй конкретные комментарии к строкам. Не аппрувь, не запрашивай изменения формально и не мержи:
            итоговое решение принимает человек. Если замечаний нет, напиши одной строкой, что проверил.
