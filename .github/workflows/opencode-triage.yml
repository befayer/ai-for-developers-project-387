name: OpenCode Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    # Only issues from the owner/collaborators; bots (including the agent) are skipped.
    if: >-
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      issues: write # gh issue edit sets labels with the workflow token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Проведи триаж issue #${{ github.event.issue.number }}. Пиши по-русски, кратко.
            Допустимые метки — только эти, других не существует:
              kind:bug, kind:feature, kind:decision, kind:quality,
              area:contract, area:server, area:web, area:delivery, area:docs,
              priority:high, priority:normal.
            1. Прежде чем что-то утверждать о коде, открой и прочитай файлы, на которые ссылаешься
               (api/main.tsp, server/, src/). Называй поля и функции так, как они названы в коде.
            2. Выбери ровно одну kind:*, одну или несколько area:*, одну priority:* и поставь их командой:
               gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "kind:...,area:...,priority:..."
               Убедись, что команда завершилась без ошибки. Новые метки не создавай.
            3. Оставь один комментарий: как ты понял проблему, где в коде она возникает (файл и строки),
               какие метки поставил и почему, чего не хватает для воспроизведения (если всё есть — так и напиши).
            Не меняй код, не создавай ветки и PR, не закрывай issue.
